```html
<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================
         BASIC META INFORMATION
    ========================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- =========================
         PAGE INFORMATION
    ========================== -->

    <title>Modern Switch Calculator</title>

    <meta
        name="description"
        content="A modern switch calculator built using HTML, CSS and JavaScript."
    >


    <!-- =========================
         CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =========================
         MAIN APPLICATION
    ========================== -->

    <main class="calculator">


        <!-- =========================
             CALCULATOR HEADER
        ========================== -->

        <header class="calculator-header">

            <h1 class="calculator-title">
                🧮 Switch Calculator
            </h1>

            <p class="calculator-subtitle">
                Simple arithmetic using JavaScript switch-case
            </p>

        </header>


        <!-- =========================
             CALCULATOR CONTENT
        ========================== -->

        <section class="calculator-content">


            <!-- =========================
                 FIRST NUMBER
            ========================== -->

            <div class="input-group">

                <label for="firstNumber">
                    First Number
                </label>

                <input
                    type="number"
                    id="firstNumber"
                    name="firstNumber"
                    placeholder="Enter first number"
                    autocomplete="off"
                >

            </div>


            <!-- =========================
                 OPERATOR
            ========================== -->

            <div class="input-group">

                <label for="operator">
                    Select Operation
                </label>

                <select
                    id="operator"
                    name="operator"
                >

                    <option value="+">
                        Addition (+)
                    </option>

                    <option value="-">
                        Subtraction (-)
                    </option>

                    <option value="*">
                        Multiplication (×)
                    </option>

                    <option value="/">
                        Division (÷)
                    </option>

                </select>

            </div>


            <!-- =========================
                 SECOND NUMBER
            ========================== -->

            <div class="input-group">

                <label for="secondNumber">
                    Second Number
                </label>

                <input
                    type="number"
                    id="secondNumber"
                    name="secondNumber"
                    placeholder="Enter second number"
                    autocomplete="off"
                >

            </div>


            <!-- =========================
                 CALCULATOR ACTIONS
            ========================== -->

            <div class="calculator-actions">

                <button
                    type="button"
                    class="btn btn-calculate"
                    id="calculateButton"
                >
                    Calculate
                </button>

                <button
                    type="button"
                    class="btn btn-reset"
                    id="resetButton"
                >
                    Reset
                </button>

            </div>


            <!-- =========================
                 RESULT
            ========================== -->

            <section
                class="result-container"
                aria-live="polite"
            >

                <h2 class="result-title">
                    Result
                </h2>

                <p
                    class="result-value"
                    id="result"
                >
                    0
                </p>

            </section>

        </section>


        <!-- =========================
             CALCULATOR FOOTER
        ========================== -->

        <footer class="calculator-footer">

            <p>
                Built with HTML, CSS &amp; JavaScript
            </p>

        </footer>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/script.js"></script>

</body>

</html>
```
